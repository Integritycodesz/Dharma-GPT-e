services:
  - type: web
    name: dharmagpt-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python rag/populate_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

